*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#11131a;color:#f5f2e9;font:14px system-ui;display:grid;place-items:center}main{width:min(900px,94vw)}header,footer{display:flex;align-items:center;justify-content:space-between}h1{font:700 42px Georgia;margin:0 0 24px}h1 span{color:#f76}button{border:1px solid #393d4a;background:#1d202b;color:#ddd;border-radius:20px;padding:9px 15px;font-size:11px}#keys{height:300px;display:flex;position:relative;filter:drop-shadow(0 16px 18px #0008)}.key{position:relative;flex:1;border:1px solid #aaa;border-radius:0 0 9px 9px;background:linear-gradient(100deg,#fff,#dedbd1);color:#777;display:flex;align-items:end;justify-content:center;padding-bottom:18px;font-weight:650;user-select:none;touch-action:none}.key:first-child{border-radius:7px 0 9px 9px}.key:last-child{border-radius:0 7px 9px 9px}.key.on{background:#f76;color:#fff;transform:translateY(3px)}.black{position:absolute;top:0;z-index:2;width:7%;height:60%;background:linear-gradient(90deg,#08090d,#343744 45%,#08090d);border:0;border-radius:0 0 5px 5px;color:#aaa;padding-bottom:12px}.black.on{background:#f76}.black:nth-child(2){left:6.7%}.black:nth-child(4){left:21%}.black:nth-child(7){left:49.7%}.black:nth-child(9){left:64%}.black:nth-child(11){left:78.2%}footer{justify-content:end;margin-top:21px}footer i{color:#f98;font-style:normal}
</style><script>
const names=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B','C'],map='awsedftgyhujk',hz=[261.63,277.18,293.66,311.13,329.63,349.23,369.99,392,415.3,440,466.16,493.88,523.25],K=document.querySelector('#keys');let ac,oct=4,active={};names.forEach((n,i)=>{let e=document.createElement('div');e.className='key'+(n[1]?' black':'');e.textContent=n[1]?'':map[i].toUpperCase();e.dataset.i=i;K.append(e)});function play(i){ac??=new AudioContext;let o=ac.createOscillator(),g=ac.createGain(),e=K.children[i];o.frequency.value=hz[i]*2**(oct-4);o.type='triangle';g.gain.setValueAtTime(.0001,ac.currentTime);g.gain.exponentialRampToValueAtTime(.22,ac.currentTime+.015);o.connect(g).connect(ac.destination);o.start();active[i]=[o,g];e.classList.add('on');note.textContent=names[i]+oct}function stop(i){let a=active[i];if(!a)return;a[1].gain.exponentialRampToValueAtTime(.0001,ac.currentTime+.15);a[0].stop(ac.currentTime+.16);K.children[i].classList.remove('on');delete active[i]}function down(i){if(!active[i])play(i)}K.onpointerdown=e=>{let k=e.target.closest('.key');if(k){e.preventDefault();down(+k.dataset.i)}};onpointerup=()=>Object.keys(active).forEach(stop);onkeydown=e=>{if(e.repeat)return;let i=map.indexOf(e.key.toLowerCase());if(i>-1)down(i);if(e.key==='ArrowUp'||e.key==='ArrowDown')setOct(oct+(e.key==='ArrowUp'?1:-1))};function setOct(n){oct=Math.max(1,Math.min(7,n));document.querySelector('#oct').textContent='OCT '+oct}document.querySelector('#oct').onclick=()=>setOct(oct%7+1);
</script>
